<video id="v" controls autoplay muted playsinline style="width:100%;max-width:960px"></video>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
<script>
  const src = '/hls/stream.m3u8', v = document.getElementById('v');
  if (Hls.isSupported()) { const h = new Hls(); h.loadSource(src); h.attachMedia(v); }
  else if (v.canPlayType('application/vnd.apple.mpegurl')) v.src = src;
</script>
